<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WAFLOW :: Blocklist</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23128C7E'/%3E%3Cpath d='M32 14c-9.9 0-18 8.1-18 18 0 3.5 1 6.8 2.7 9.6L14 50l8.7-2.6c2.6 1.5 5.7 2.4 9.3 2.4 9.9 0 18-8.1 18-18s-8.1-17.8-18-17.8z' fill='%2325D366'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body class="app-page">
    <div id="app-nav"></div>
    <div class="page-content">
    <div class="container">
      <div class="row justify-content-center">
        <div class="main-card p-4">
          <div class="mb-4">
            <h4 class="mb-0 text-muted fw-bold">Blocklist</h4>
          </div>
          <p class="text-muted small">
            Numbers here are skipped automatically on every send. Numbers are
            added here automatically when they reply "STOP" to a linked
            session, or you can add them manually below.
          </p>

          <div class="row g-4">
            <div class="col-md-5">
              <h6 class="fw-bold">Add Number</h6>
              <div class="input-group">
                <input
                  type="text"
                  id="blockNumber"
                  class="form-control"
                  placeholder="e.g. 923001234567"
                />
                <button id="addBlock" class="btn btn-danger">Block</button>
              </div>
            </div>
            <div class="col-md-7">
              <h6 class="fw-bold">Blocked Numbers</h6>
              <div id="blockList" class="list-group"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
      function loadBlocklist() {
        fetch("/api/blocklist")
          .then((res) => res.json())
          .then((numbers) => {
            if (!numbers.length) {
              $("#blockList").html('<div class="text-muted small">No blocked numbers.</div>');
              return;
            }
            const html = numbers
              .map(
                (n) => `
              <div class="list-group-item d-flex justify-content-between align-items-center">
                ${n}
                <button class="btn btn-sm btn-outline-secondary unblock" data-number="${n}">
                  <i class="fa fa-times"></i> Unblock
                </button>
              </div>
            `,
              )
              .join("");
            $("#blockList").html(html);
          });
      }

      $("#addBlock").on("click", function () {
        const number = $("#blockNumber").val().trim();
        if (!number) return;
        fetch("/api/blocklist", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ number }),
        }).then(() => {
          $("#blockNumber").val("");
          loadBlocklist();
        });
      });

      $(document).on("click", ".unblock", function () {
        const number = $(this).data("number");
        fetch(`/api/blocklist/${number}`, { method: "DELETE" }).then(() => loadBlocklist());
      });

      loadBlocklist();
    </script>
    <script src="js/nav.js"></script>
  </body>
</html>
