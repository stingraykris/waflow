<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WAFLOW :: Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23128C7E'/%3E%3Cpath d='M32 14c-9.9 0-18 8.1-18 18 0 3.5 1 6.8 2.7 9.6L14 50l8.7-2.6c2.6 1.5 5.7 2.4 9.3 2.4 9.9 0 18-8.1 18-18s-8.1-17.8-18-17.8z' fill='%2325D366'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-11 col-sm-10 col-md-8 col-lg-9 login-card">
          <div class="row g-0">
            <div
              class="col-md-6 d-none d-md-flex login-brand-panel"
            >
              <svg class="brand-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="64" height="64" rx="16" fill="rgba(255,255,255,0.15)" />
                <path d="M32 14c-9.9 0-18 8.1-18 18 0 3.5 1 6.8 2.7 9.6L14 50l8.7-2.6c2.6 1.5 5.7 2.4 9.3 2.4 9.9 0 18-8.1 18-18s-8.1-17.8-18-17.8z" fill="#fff" />
              </svg>
              <h3>WAFLOW</h3>
              <p>WhatsApp automation built for small businesses - broadcasts, auto-replies, and safer sending.</p>
            </div>

            <div class="col-md-6 p-4 p-lg-5">
              <form
                action="/login"
                method="post"
                class="needs-validation"
                novalidate
              >
                <h2 class="mb-0">
                  <span class="wa-text">WA</span
                  ><span class="flow-text">FLOW</span> - Login
                </h2>
                <div class="mb-3">
                  <label class="form-label small fw-bold" for="mobile"
                    >Mobile</label
                  >
                  <div class="input-group">
                    <span class="input-group-text border-end-0 bg-transparent"
                      ><i class="fa fa-mobile text-muted"></i
                    ></span>
                    <input
                      type="text"
                      name="mobile"
                      id="mobile"
                      class="form-control border-start-0"
                      placeholder="3004565821"
                      required
                    />
                  </div>
                </div>

                <div class="mb-4">
                  <label class="form-label small fw-bold" for="pass">Password</label>
                  <div class="input-group">
                    <span class="input-group-text border-end-0 bg-transparent"
                      ><i class="fa fa-lock text-muted"></i
                    ></span>
                    <input
                      type="password"
                      name="pass"
                      id="pass"
                      class="form-control border-start-0"
                      placeholder="********"
                      required
                    />
                  </div>
                </div>

                <div class="d-grid">
                  <button
                    type="submit"
                    class="btn btn-success btn-lg shadow-sm"
                  >
                    Login
                  </button>
                </div>

              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
      (function () {
        "use strict";
        var forms = document.querySelectorAll(".needs-validation");
        Array.prototype.slice.call(forms).forEach(function (form) {
          form.addEventListener(
            "submit",
            function (event) {
              if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();

                // Use SweetAlert for validation error
                Swal.fire({
                  icon: "error",
                  title: "Oops...",
                  text: "Please fill in all required fields correctly!",
                  confirmButtonColor: "#198754",
                  
                });
              }
             // form.classList.add("was-validated");
            },
            false,
          );
        });
      })();
    </script>
  </body>
</html>
