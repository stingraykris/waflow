<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WAFLOW :: Jobs status</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23128C7E'/%3E%3Cpath d='M32 14c-9.9 0-18 8.1-18 18 0 3.5 1 6.8 2.7 9.6L14 50l8.7-2.6c2.6 1.5 5.7 2.4 9.3 2.4 9.9 0 18-8.1 18-18s-8.1-17.8-18-17.8z' fill='%2325D366'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="css/app.css" />

    <style>
      .status-waiting {
        border-left-color: #ffc107;
      }
      .status-active {
        border-left-color: #0dcaf0;
      }
      .status-completed {
        border-left-color: #198754;
      }
      .status-failed {
        border-left-color: #dc3545;
      }
      .status-delayed {
        border-left-color: #6f42c1;
      }
      .scroll-column {
        max-height: 65vh;
        overflow-y: auto;
        padding: 10px;
        background: #fafafa;
        border-radius: 8px;
      }
      .job-item {
        word-break: break-word;
      }
      .job-item .small {
        display: block;
        max-height: 4.5em;
        overflow-y: auto;
      }
      .text-purple {
        color: #6f42c1;
      }
      .main-card {
        max-width: 1400px !important;
      }
      @media (min-width: 992px) {
        .col-md-2-4 {
          flex: 0 0 20%;
          max-width: 20%;
        }
      }
      @media (min-width: 576px) and (max-width: 991.98px) {
        .col-md-2-4 {
          flex: 0 0 33.3333%;
          max-width: 33.3333%;
        }
      }
    </style>
  </head>
  <body class="app-page">
    <div id="app-nav"></div>
    <div class="page-content">
    <div class="container">
      <div class="row justify-content-center">
        <div class="main-card p-4">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
              <h4 class="mb-0 text-muted fw-bold">Job Queue</h4>
              <div class="d-flex gap-2 align-items-center">
                <span class="text-muted small">Session:</span>
                <span id="session-id">Connecting...</span>
              </div>
            </div>
            <div class="align-items-end">
              <button
                class="btn btn-outline-primary btn-sm"
                onclick="refreshAll()"
              >
                <i class="fas fa-sync-alt me-1"></i> Refresh
              </button>
              <button
                class="btn btn-outline-success btn-sm"
                onclick="exportCsv()"
              >
                <i class="fas fa-file-csv me-1"></i> Export CSV
              </button>
            </div>
          </div>

          <div class="row g-3 mb-4 text-center">
            <div class="col-6 col-md-2-4">
              <div
                class="card stat-box stat-waiting p-2 shadow-sm"
              >
                <small
                  class="text-muted text-uppercase fw-bold"
                  style="font-size: 0.7rem"
                  >Waiting</small
                >
                <h3 id="stat-waiting" class="mb-0">0</h3>
              </div>
            </div>
            <div class="col-6 col-md-2-4">
              <div
                class="card stat-box stat-active p-2 shadow-sm"
              >
                <small
                  class="text-muted text-uppercase fw-bold"
                  style="font-size: 0.7rem"
                  >Active</small
                >
                <h3 id="stat-active" class="mb-0">0</h3>
              </div>
            </div>
            <div class="col-6 col-md-2-4">
              <div
                class="card stat-box stat-completed p-2 shadow-sm"
              >
                <small
                  class="text-muted text-uppercase fw-bold"
                  style="font-size: 0.7rem"
                  >Completed</small
                >
                <h3 id="stat-completed" class="mb-0">0</h3>
              </div>
            </div>
            <div class="col-6 col-md-2-4">
              <div
                class="card stat-box stat-failed p-2 shadow-sm"
              >
                <small
                  class="text-muted text-uppercase fw-bold"
                  style="font-size: 0.7rem"
                  >Failed</small
                >
                <h3 id="stat-failed" class="mb-0">0</h3>
              </div>
            </div>
            <div class="col-6 col-md-2-4">
              <div
                class="card stat-box stat-delayed p-2 shadow-sm"
              >
                <small
                  class="text-muted text-uppercase fw-bold"
                  style="font-size: 0.7rem"
                  >Scheduled</small
                >
                <h3 id="stat-delayed" class="mb-0">0</h3>
              </div>
            </div>
          </div>

          <div class="row g-3">
            <div class="col-md-2-4">
              <h6 class="text-muted mb-3">
                <i class="fas fa-pause-circle me-2"></i>Waiting
              </h6>
              <div id="waitingList" class="scroll-column border"></div>
              <div id="pager-waiting" class="d-flex justify-content-between align-items-center mt-1 small"></div>
            </div>
            <div class="col-md-2-4">
              <h6 class="text-purple mb-3">
                <i class="fas fa-clock me-2"></i>Scheduled
              </h6>
              <div id="delayedList" class="scroll-column border"></div>
              <div id="pager-delayed" class="d-flex justify-content-between align-items-center mt-1 small"></div>
            </div>
            <div class="col-md-2-4">
              <h6 class="text-info mb-3">
                <i class="fas fa-play-circle me-2"></i>In Progress
              </h6>
              <div id="activeList" class="scroll-column border"></div>
              <div id="pager-active" class="d-flex justify-content-between align-items-center mt-1 small"></div>
            </div>
            <div class="col-md-2-4">
              <h6 class="text-success mb-3">
                <i class="fas fa-check-double me-2"></i>Success
              </h6>
              <div id="completedList" class="scroll-column border"></div>
              <div id="pager-completed" class="d-flex justify-content-between align-items-center mt-1 small"></div>
            </div>
            <div class="col-md-2-4">
              <h6 class="text-danger mb-3 d-flex justify-content-between align-items-center">
                <span><i class="fas fa-times-circle me-2"></i>Failed</span>
                <button class="btn btn-sm btn-outline-danger" onclick="retryAllFailed()">
                  <i class="fa fa-rotate-right"></i> Retry All
                </button>
              </h6>
              <div id="failedList" class="scroll-column border"></div>
              <div id="pager-failed" class="d-flex justify-content-between align-items-center mt-1 small"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
      var socket = io();
      let currentSessionId = null;

      const PAGE_SIZE = 20;
      const COLUMNS = ["waiting", "delayed", "active", "completed", "failed"];
      const columnPages = { waiting: 0, delayed: 0, active: 0, completed: 0, failed: 0 };
      const listSelector = { waiting: "#waitingList", delayed: "#delayedList", active: "#activeList", completed: "#completedList", failed: "#failedList" };
      const statusClass = { waiting: "status-waiting", delayed: "status-delayed", active: "status-active", completed: "status-completed", failed: "status-failed" };

      socket.on("session-id", function (id) {
        currentSessionId = id;
        $("#session-id").text(id);
        refreshAll();
      });

      function refreshAll() {
        if (!currentSessionId) return;
        loadQueueStatus(currentSessionId);
        COLUMNS.forEach(loadColumn);
      }

      // 1. Fetch High-level Counts (Queue Status)
      function loadQueueStatus(sessionId) {
        $.get(`/queue-status/${sessionId}`, function (counts) {
          $("#stat-waiting").text(counts.waiting || 0);
          $("#stat-active").text(counts.active || 0);
          $("#stat-completed").text(counts.completed || 0);
          $("#stat-failed").text(counts.failed || 0);
          $("#stat-delayed").text(counts.delayed || 0);
        });
      }

      // 2. Fetch one column's current page independently, so each column
      // can be paged through without resetting the others.
      function loadColumn(status) {
        if (!currentSessionId) return;
        const page = columnPages[status];
        $.get(`/queue-jobs/${currentSessionId}?page=${page}&pageSize=${PAGE_SIZE}`, function (data) {
          renderJobs(listSelector[status], data[status], statusClass[status]);
          renderPager(status, data.totals?.[status] || 0, page);
        });
      }

      function renderPager(status, total, page) {
        if (total <= PAGE_SIZE) {
          // Nothing to page through - a count is enough, skip the controls.
          $(`#pager-${status}`).html(
            total ? `<span class="text-muted">${total} total</span>` : "",
          );
          return;
        }

        const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
        const html = `
          <button class="btn btn-sm btn-outline-secondary" ${page <= 0 ? "disabled" : ""} onclick="changePage('${status}', -1)"><i class="fa fa-chevron-left"></i></button>
          <span class="text-muted">Page ${page + 1} of ${totalPages} (${total})</span>
          <button class="btn btn-sm btn-outline-secondary" ${page + 1 >= totalPages ? "disabled" : ""} onclick="changePage('${status}', 1)"><i class="fa fa-chevron-right"></i></button>
        `;
        $(`#pager-${status}`).html(html);
      }

      function changePage(status, delta) {
        columnPages[status] = Math.max(0, columnPages[status] + delta);
        loadColumn(status);
      }

      function renderJobs(container, jobs) {
        let html = "";

        if (!jobs || jobs.length === 0) {
          html =
            '<div class="text-muted small p-2">No jobs in this category.</div>';
        } else {
          jobs.forEach((j) => {
            // Formatting date and time as requested
            const fullDate = new Date(j.timestamp).toLocaleString("en-GB", {
              day: "2-digit",
              month: "2-digit",
              year: "numeric",
              hour: "2-digit",
              minute: "2-digit",
              second: "2-digit",
            });

            const deliveryBadge = j.deliveryStatus
              ? `<span class="badge bg-info text-dark ms-1">${j.deliveryStatus}</span>`
              : "";

            const mediaBadge = j.file
              ? `<span class="badge bg-primary ms-1"><i class="fa fa-paperclip"></i> media</span>`
              : "";

            const retryBtn =
              j.status === "failed"
                ? `<button class="btn btn-sm btn-outline-danger mt-1 retry-job" data-job-id="${j.id}"><i class="fa fa-rotate-right"></i> Retry</button>`
                : "";

            html += `
          <div class="job-item border-bottom p-2 mb-2">
            <b class="text-primary">${j.number}</b>${mediaBadge}<br>
            <span class="small">${j.message}</span><br>
            <small class="text-muted">
              <i class="far fa-calendar-alt"></i> ${fullDate} |
              <span class="badge ${j.status === "failed" ? "bg-danger" : "bg-secondary"}">${j.status}</span>${deliveryBadge}
            </small>
            ${j.failedReason ? `<br><small class="text-danger">Reason: ${j.failedReason}</small>` : ""}
            ${retryBtn ? `<br>${retryBtn}` : ""}
          </div>
        `;
          });
        }

        $(container).html(html);
      }

      $(document).on("click", ".retry-job", function () {
        const jobId = $(this).data("job-id");
        $.post(`/queue-jobs/${currentSessionId}/${jobId}/retry`, function () {
          refreshAll();
        });
      });

      function retryAllFailed() {
        if (!currentSessionId) return;
        $.post(`/queue-jobs/${currentSessionId}/retry-failed`, function (res) {
          refreshAll();
        });
      }

      function csvEscape(value) {
        const s = String(value ?? "");
        return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
      }

      function exportCsv() {
        if (!currentSessionId) return;
        $.get(`/queue-jobs/${currentSessionId}?page=0&pageSize=2000`, function (data) {
          const rows = [...data.waiting, ...data.delayed, ...data.active, ...data.completed, ...data.failed];
          const header = ["number", "message", "status", "deliveryStatus", "hasMedia", "timestamp", "failedReason"];
          const lines = [header.join(",")];
          rows.forEach((j) => {
            lines.push(
              [
                csvEscape(j.number),
                csvEscape(j.message),
                csvEscape(j.status),
                csvEscape(j.deliveryStatus || ""),
                csvEscape(j.file ? "yes" : "no"),
                csvEscape(new Date(j.timestamp).toISOString()),
                csvEscape(j.failedReason || ""),
              ].join(","),
            );
          });

          const blob = new Blob([lines.join("\n")], { type: "text/csv" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `queue-${currentSessionId}-${Date.now()}.csv`;
          a.click();
          URL.revokeObjectURL(url);
        });
      }

      // Auto-refresh every 15 seconds to keep counts live
      setInterval(refreshAll, 15000);
    </script>
    <script src="js/nav.js"></script>
  </body>
</html>
